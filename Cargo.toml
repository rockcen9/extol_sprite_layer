[package]
name = "extol_sprite_layer"
version = "0.5.0"
edition = "2021"
authors = ["Ash <ext0l@catgirl.ai>"]
categories = ["game-development"]
description = "Explicitly-defined sprite layers for Bevy, including automatic y-sorting."
keywords = ["gamedev", "bevy"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/deifactor/extol_sprite_layer"
exclude = ["docs/*"]

[dependencies]
bevy = { rev = "d06aa47744dfa378f2e8a31cd7ff2d59c9afe4b9", git = "https://github.com/bevyengine/bevy", default-features = false }
ordered-float = "5.1.0"
tap = "1.0.1"

[dev-dependencies]
bevy = { rev = "d06aa47744dfa378f2e8a31cd7ff2d59c9afe4b9", git = "https://github.com/bevyengine/bevy", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_sprite",
    "bevy_core_pipeline",
    "x11",
] }
criterion = "0.5.0"
fastrand = "1.9.0"

[[bench]]
name = "benchmark"
harness = false
